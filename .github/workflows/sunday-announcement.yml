name: Football Sunday announcement

on:
  schedule:
    - cron: '0 11 * * 0'
      timezone: Europe/Zurich
  workflow_dispatch:
    inputs:
      send:
        description: 'Send the Sunday photo (false = read-only event preview)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: football-sunday-announcement
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install tzdata
      - run: python -m unittest discover -s sunday_announcement -p 'test_*.py' -v

  announce:
    needs: tests
    # An always-on CLOUD VM, not the user's Windows machine.
    # Scheduled sending is disabled until the repository variable is set explicitly.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.SUNDAY_AUTOMATION_ENABLED == 'true')
    runs-on: [self-hosted, linux, x64, football-sunday]
    timeout-minutes: 20
    env:
      SUNDAY_STATE_DIR: ${{ vars.SUNDAY_STATE_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read original workflow creation time
        id: origin
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
            });
            core.setOutput('created_at', data.created_at);
      - name: Validate cloud runner setup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUNDAY_STATE_DIR" || { echo 'Set SUNDAY_STATE_DIR repository variable.'; exit 1; }
          [[ "$SUNDAY_STATE_DIR" = /* ]] || { echo 'SUNDAY_STATE_DIR must be absolute.'; exit 1; }
          test -d "$SUNDAY_STATE_DIR"
          test -x "$SUNDAY_STATE_DIR/venv/bin/python"
          test -f "$SUNDAY_STATE_DIR/config.json"
          "$SUNDAY_STATE_DIR/venv/bin/python" -c 'from announce import state_directory; state_directory()'
        env:
          PYTHONPATH: ${{ github.workspace }}/sunday_announcement
      - name: Run Sunday announcement
        env:
          SUNDAY_RUN_CREATED_AT: ${{ steps.origin.outputs.created_at }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SEND: ${{ inputs.send }}
          SENDING_ENABLED: ${{ vars.SUNDAY_AUTOMATION_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          args=(run --headless)
          if [[ "$EVENT_NAME" == 'schedule' || "$MANUAL_SEND" == 'true' ]]; then
            [[ "$SENDING_ENABLED" == 'true' ]] || { echo 'Set SUNDAY_AUTOMATION_ENABLED after validating setup.'; exit 1; }
            args+=(--send)
          fi
          # Keep browser errors, chat evidence and account information off public Actions logs.
          # announce.py holds its own OS lock shared with manual invocations.
          if "$SUNDAY_STATE_DIR/venv/bin/python" sunday_announcement/announce.py "${args[@]}" > "$SUNDAY_STATE_DIR/last-run.log" 2>&1; then
            echo 'Details are retained on the private cloud runner.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Failed or blocked. Inspect last-run.log on the cloud runner; check receipts before retrying.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  disabled: